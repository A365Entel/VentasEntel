<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ventas - VentaEntel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .form-group input[type="date"] {
            cursor: pointer;
        }

        .form-group .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 82, 152, 0.3);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #2a5298;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 6px 6px 0;
        }

        .info-box p {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-box strong {
            color: #333;
        }
        
        /* Autocomplete styles */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        .autocomplete-input:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1); }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; }
        .autocomplete-list.active { display: block; }
        .autocomplete-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .autocomplete-item:hover { background: #f5f5f5; }
        .autocomplete-item .name { font-weight: 600; color: #333; }
        .autocomplete-item .detail { font-size: 12px; color: #666; }
        .readonly-field { background-color: #f5f5f5 !important; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Formulario de Ventas - VentaEntel</h1>
            <p>Registro diario de llamadas y ventas</p>
        </div>
        
        <div class="form-content">
            <div id="message" class="message"></div>
            
            <div class="info-box">
                <p><strong>📅 Fecha:</strong> Se registra automáticamente</p>
                <p><strong>⚠️ Importante:</strong> Todos los campos son obligatorios</p>
            </div>

            <form id="salesForm">
                <!-- Columna 1: Fecha (automático) -->
                <div class="form-group">
                    <label for="fecha">Fecha de Registro</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <!-- Supervisor con Autocomplete -->
                <div class="form-group">
                    <label for="supervisor">Supervisor <span class="required">*</span></label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="supervisor" class="autocomplete-input" placeholder="Escribe el nombre del supervisor..." autocomplete="off" required>
                        <div id="supervisor-list" class="autocomplete-list"></div>
                    </div>
                </div>

                <!-- Agente con Autocomplete -->
                <div class="form-group">
                    <label for="agente">Agente <span class="required">*</span></label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="agente" class="autocomplete-input" placeholder="Escribe el nombre del agente..." autocomplete="off" required>
                        <div id="agente-list" class="autocomplete-list"></div>
                    </div>
                </div>

                <!-- DNI (autocompletado) -->
                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni" readonly class="readonly-field" placeholder="Se autocompleta al seleccionar agente">
                </div>

                <!-- User ID (autocompletado) -->
                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" name="userId" readonly class="readonly-field" placeholder="Se autocompleta al seleccionar agente">
                </div>

                <!-- Campaña (autocompletado) -->
                <div class="form-group">
                    <label for="campana">Campaña</label>
                    <input type="text" id="campana" name="campana" readonly class="readonly-field" placeholder="Se autocompleta al seleccionar agente">
                </div>

                <!-- Objetivo -->
                <div class="form-group">
                    <label for="objetivo">Objetivo Diario <span class="required">*</span></label>
                    <input type="number" id="objetivo" name="objetivo" placeholder="Cantidad objetivo de ventas" min="0" required>
                </div>

                <!-- Ventas -->
                <div class="form-group">
                    <label for="ventas">Cantidad de Ventas <span class="required">*</span></label>
                    <input type="number" id="ventas" name="ventas" placeholder="Número de ventas realizadas" min="0" required>
                </div>

                <!-- Llamadas -->
                <div class="form-group">
                    <label for="llamadas">Cantidad de Llamadas <span class="required">*</span></label>
                    <input type="number" id="llamadas" name="llamadas" placeholder="Total de llamadas realizadas" min="0" required>
                    <p class="hint">Se usará para calcular la efectividad (ventas/llamadas * 100)</p>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    📤 Enviar Registro
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Enviando datos a Google Sheets...</p>
            </div>
        </div>
    </div>

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');
            
            // Obtener valores del formulario

                supervisor: document.getElementById('supervisor').value,

                llamadas: parseInt(document.getElementById('llamadas').value)
            };

                formData.efectividad = 0;
            } else {
                formData.efectividad = (formData.ventas / formData.llamadas * 100).toFixed(2);
            }

            // Mostrar loading
            submitBtn.disabled = true;
            loading.classList.add('active');
            message.className = 'message';
            message.style.display = 'none';

                    headers: {

                    body: JSON.stringify(formData),

                });

                document.getElementById('fecha').valueAsDate = new Date();

                message.textContent = '❌ Error al enviar. Verifica la conexión e intenta nuevamente.';
                message.className = 'message error';
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
            }
        });
